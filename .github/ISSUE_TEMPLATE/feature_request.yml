name: Feature request
description: Suggest an improvement for Japanese-learning workflows.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult about your current workflow? Avoid private note content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would like to do as a user.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: benefit
    attributes:
      label: Benefit for Japanese learners
    validations:
      required: true
